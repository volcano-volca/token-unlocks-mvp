<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Radar · 代币解锁看板（MVP）</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e8eaf0; --dim:#9aa3b2; --up:#f6465d; --warn:#f0b90b; --ok:#2ebd85; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:24px; max-width:1200px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  h1 { font-size:22px; }
  h1 small { color:var(--dim); font-weight:normal; font-size:13px; margin-left:8px; }
  .meta { color:var(--dim); font-size:12px; }
  .filters { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .filters button.active { border-color:var(--warn); color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card.hot { border-color:var(--up); }
  .card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .sym { font-size:18px; font-weight:700; }
  .sym a { color:var(--txt); text-decoration:none; }
  .price { color:var(--dim); font-size:13px; }
  .badge { font-size:12px; padding:3px 10px; border-radius:20px; font-weight:600; }
  .badge.hot { background:rgba(246,70,93,.15); color:var(--up); }
  .badge.warn { background:rgba(240,185,11,.15); color:var(--warn); }
  .badge.calm { background:rgba(46,189,133,.12); color:var(--ok); }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-top:1px solid var(--line); }
  .row span:first-child { color:var(--dim); }
  .date { font-size:15px; font-weight:600; margin:8px 0 4px; }
  .countdown { font-size:12px; color:var(--dim); margin-bottom:6px; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; line-height:1.8; border-top:1px solid var(--line); padding-top:14px; }
  .empty { color:var(--dim); padding:40px; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1>Unlock Radar <small>代币解锁看板 · MVP</small></h1>
  <div class="meta" id="meta">加载中…</div>
</header>

<div class="filters" id="filters">
  <button data-f="all" class="active">全部</button>
  <button data-f="hot">≥5% 市值（高危）</button>
  <button data-f="warn">1–5%（关注）</button>
  <button data-f="soon">7天内解锁</button>
</div>

<div class="grid" id="grid"></div>

<footer>
  数据来源：Dropstab 公开页面（每日更新），仅供参考，不构成投资建议。关键事件请以项目官方披露为准。<br>
  覆盖边界：免费数据源仅覆盖"有临近解锁"的币种；主流大币种若无临近解锁不会出现在列表中。解锁≠卖出，实际抛压取决于解锁后资金流向。
</footer>

<script>
const state = { data:null, filter:'all' };

function level(pct){
  if (pct >= 5) return 'hot';
  if (pct >= 1) return 'warn';
  return 'calm';
}
function levelText(pct){
  if (pct >= 5) return '高危';
  if (pct >= 1) return '关注';
  return '温和';
}
function daysLeft(dateStr){
  const d = (new Date(dateStr+'T00:00:00Z') - Date.now()) / 864e5;
  return Math.max(0, Math.ceil(d));
}
function fmtUSD(n){
  if (n == null) return '—';
  if (n >= 1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(0);
}
function fmtNum(n){
  if (n == null) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toFixed(0);
}

function render(){
  const grid = document.getElementById('grid');
  const tokens = state.data.tokens.filter(t => {
    const ev = t.upcoming_events[0];
    if (!ev) return false;
    const pct = t.next_unlock_mcap_pct || 0;
    if (state.filter === 'hot') return pct >= 5;
    if (state.filter === 'warn') return pct >= 1 && pct < 5;
    if (state.filter === 'soon') return daysLeft(ev.date) <= 7;
    return true;
  });
  if (!tokens.length){
    grid.innerHTML = '<div class="empty">该筛选条件下暂无解锁事件</div>';
    return;
  }
  grid.innerHTML = tokens.map(t => {
    const ev = t.upcoming_events[0];
    const pct = t.next_unlock_mcap_pct || 0;
    const lv = level(pct);
    const dl = daysLeft(ev.date);
    return `<div class="card ${lv==='hot'?'hot':''}">
      <div class="top">
        <div><span class="sym"><a href="https://dropstab.com/coins/${t.slug}/vesting" target="_blank">${t.symbol}</a></span>
        <span class="price"> $${t.price_usd} · 市值 ${fmtUSD(t.market_cap_usd)}</span></div>
        <span class="badge ${lv}">${levelText(pct)}</span>
      </div>
      <div class="date">📅 ${ev.date} <span style="font-weight:normal;color:var(--dim)">（${dl===0?'今天':dl+'天后'}）</span></div>
      <div class="countdown">${ev.allocation} · ${ev.unlock_type}</div>
      <div class="row"><span>解锁数量</span><span>${fmtNum(t.next_unlock_tokens)} ${t.symbol}</span></div>
      <div class="row"><span>解锁金额</span><span>${fmtUSD(t.next_unlock_usd)}</span></div>
      <div class="row"><span>占市值</span><span style="color:${lv==='hot'?'var(--up)':lv==='warn'?'var(--warn)':'var(--txt)'}">${pct.toFixed(2)}%</span></div>
    </div>`;
  }).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.filter = b.dataset.f;
  render();
});

fetch('data/unlocks.json')
  .then(r => r.json())
  .then(d => {
    state.data = d;
    const dt = new Date(d.updated_at);
    document.getElementById('meta').textContent =
      `更新于 ${dt.toLocaleString('zh-CN',{hour12:false})} · ${d.tokens.length} 个币种 · ${d.tokens.reduce((a,t)=>a+t.events_count,0)} 个待解锁事件`;
    render();
  })
  .catch(() => {
    document.getElementById('meta').textContent = '数据加载失败';
  });
</script>
</body>
</html>
